<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors!</title>
    <link rel="stylesheet" href="content/css/style.css" />
  </head>
  <body>
    <div id="rpsWrapper">
      <div id="rpsArea">
        <div id="rpsPrep">
          <p id="rpsStartDisplay">Get ready!</p>
        </div>
        <div id="rpsResult">
          <div id="rpsYou">
            <p>YOU:</p>
            <p id="rpsYourPick">Rock</p>
          </div>
          <div id="rpsCom">
            <p>COM:</p>
            <p id="rpsComPick">Paper</p>
          </div>
        </div>
        <div id="rpsScore">
          <p id="plScoreText" style="margin-left: 100px">You:<br />0</p>
          <p id="comScoreText" style="margin-right: 100px">Com:<br />0</p>
        </div>
        <div id="rpsDescription">
          Welcome to an exciting game of RPS.<br />
          Press the start-button to start!
        </div>
        <div id="rpsStart">
          <button id="startBtn" class="buttons">Start</button>
        </div>
        <div id="rpsPicker">
          <button id="rockBtn" class="buttons">Rock</button>
          <button id="paperBtn" class="buttons">Paper</button>
          <button id="scissorsBtn" class="buttons">Scissors</button>
        </div>
      </div>
    </div>
    <script src="content/js/script.js" type="text/javascript"></script>
  </body>
</html>
